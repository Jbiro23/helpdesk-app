<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ulaznica</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container">
				<span class="navbar-brand">Helpdesk</span>
				<div class="d-flex align-items-center">
					<span class="navbar-text text-white me-3" id="user-name"></span>
					<button
						type="button"
						id="logout-btn"
						class="btn btn-outline-light btn-sm"
					>
						Odjava
					</button>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-md-8">
					<div class="mb-3">
						<a href="#" id="back-link" class="btn btn-outline-secondary btn-sm"
							>Natrag</a
						>
					</div>

					<div id="alert" class="alert d-none" role="alert"></div>

					<div class="card mb-4" id="ticket-card">
						<div class="card-body">
							<div class="d-flex justify-content-between align-items-start">
								<h5 id="ticket-title" class="mb-2"></h5>
								<span id="ticket-status" class="badge"></span>
							</div>
							<p id="ticket-description" class="text-muted"></p>
							<div class="d-flex gap-3 small text-muted">
								<span>Kategorija: <span id="ticket-category"></span></span>
								<span>Prioritet: <span id="ticket-priority"></span></span>
								<span id="ticket-author-wrap"
									>Prijavio: <span id="ticket-author"></span
								></span>
							</div>
						</div>
					</div>

					<h6 class="mb-3">Komunikacija</h6>
					<div id="messages" class="mb-3"></div>

					<div class="card" id="reply-card">
						<div class="card-body">
							<div class="mb-2">
								<textarea
									id="message-content"
									class="form-control"
									rows="3"
									placeholder="Napišite poruku"
								></textarea>
							</div>
							<button type="button" id="send-btn" class="btn btn-primary">
								Pošalji
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/ticket.js"></script>
	</body>
</html>

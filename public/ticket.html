<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ulaznica</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container">
				<span class="navbar-brand">Helpdesk</span>
				<div class="d-flex align-items-center">
					<span class="navbar-text text-white me-3" id="user-name"></span>
					<button
						type="button"
						id="logout-btn"
						class="btn btn-outline-light btn-sm"
					>
						Odjava
					</button>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-md-8">
					<div class="mb-3">
						<a href="#" id="back-link" class="btn btn-outline-secondary btn-sm"
							>Natrag</a
						>
					</div>

					<div id="alert" class="alert d-none" role="alert"></div>

					<div class="card mb-4" id="ticket-card">
						<div class="card-body">
							<div class="d-flex justify-content-between align-items-start">
								<h5 id="ticket-title" class="mb-2"></h5>
								<span id="ticket-status" class="badge"></span>
							</div>
							<p id="ticket-description" class="text-muted"></p>
							<div class="d-flex gap-3 small text-muted">
								<span>Kategorija: <span id="ticket-category"></span></span>
								<span>Prioritet: <span id="ticket-priority"></span></span>
								<span id="ticket-author-wrap"
									>Prijavio: <span id="ticket-author"></span
								></span>
							</div>
						</div>
					</div>

					<div class="card mb-4 d-none" id="agent-controls">
						<div class="card-body">
							<h6 class="mb-3">Kontrole agenta</h6>

							<div class="mb-3" id="assign-wrap">
								<button
									type="button"
									id="assign-btn"
									class="btn btn-success btn-sm"
								>
									Preuzmi ulaznicu
								</button>
								<span class="small text-muted ms-2" id="assigned-info"></span>
							</div>

							<div class="row g-2">
								<div class="col-md-4">
									<label class="form-label small">Status</label>
									<select id="status-select" class="form-select form-select-sm">
										<option value="otvorena">Otvorena</option>
										<option value="u_obradi">U obradi</option>
										<option value="zatvorena">Zatvorena</option>
									</select>
								</div>
								<div class="col-md-4">
									<label class="form-label small">Kategorija</label>
									<select
										id="category-select"
										class="form-select form-select-sm"
									></select>
								</div>
								<div class="col-md-4">
									<label class="form-label small">Prioritet</label>
									<select
										id="priority-select"
										class="form-select form-select-sm"
									>
										<option value="nizak">Nizak</option>
										<option value="srednji">Srednji</option>
										<option value="visok">Visok</option>
										<option value="kriticni">Kritični</option>
									</select>
								</div>
							</div>
							<button
								type="button"
								id="save-changes-btn"
								class="btn btn-primary btn-sm mt-3"
							>
								Spremi promjene
							</button>
						</div>
					</div>

					<h6 class="mb-3">Komunikacija</h6>
					<div id="messages" class="mb-3"></div>

					<div class="card" id="reply-card">
						<div class="card-body">
							<div
								class="d-flex justify-content-between align-items-center mb-2"
							>
								<label class="form-label mb-0">Odgovor</label>
								<button
									type="button"
									id="ai-draft-btn"
									class="btn btn-outline-primary btn-sm d-none"
								>
									Generiraj AI nacrt
								</button>
							</div>
							<div class="mb-2">
								<textarea
									id="message-content"
									class="form-control"
									rows="3"
									placeholder="Napišite poruku"
								></textarea>
							</div>
							<button type="button" id="send-btn" class="btn btn-primary">
								Pošalji
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/ticket.js"></script>
	</body>
</html>

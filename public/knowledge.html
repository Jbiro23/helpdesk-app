<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Baza znanja</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container">
				<span class="navbar-brand"
					>Helpdesk <span class="badge bg-primary">Agent</span></span
				>
				<div class="d-flex align-items-center">
					<a href="agent.html" class="btn btn-outline-light btn-sm me-2"
						>Ulaznice</a
					>
					<span class="navbar-text text-white me-3" id="user-name"></span>
					<button
						type="button"
						id="logout-btn"
						class="btn btn-outline-light btn-sm"
					>
						Odjava
					</button>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<h4 class="mb-3">Baza znanja</h4>

			<div id="alert" class="alert d-none" role="alert"></div>

			<div class="row">
				<div class="col-md-5">
					<div class="card mb-4">
						<div class="card-body">
							<h6 class="mb-3">Novi članak</h6>
							<div class="mb-2">
								<label class="form-label small">Naslov</label>
								<input
									type="text"
									id="kb-title"
									class="form-control form-control-sm"
								/>
							</div>
							<div class="mb-2">
								<label class="form-label small">Kategorija</label>
								<select
									id="kb-category"
									class="form-select form-select-sm"
								></select>
							</div>
							<div class="mb-2">
								<label class="form-label small">Sadržaj</label>
								<textarea
									id="kb-content"
									class="form-control form-control-sm"
									rows="6"
								></textarea>
							</div>
							<button
								type="button"
								id="kb-save-btn"
								class="btn btn-primary btn-sm"
							>
								Spremi članak
							</button>
						</div>
					</div>
				</div>

				<div class="col-md-7">
					<div id="kb-empty" class="text-center text-muted py-5 d-none">
						Baza znanja je prazna.
					</div>
					<div id="kb-list"></div>
				</div>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/knowledge.js"></script>
	</body>
</html>

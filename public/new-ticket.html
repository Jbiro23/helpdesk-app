<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nova ulaznica</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container">
				<span class="navbar-brand">Helpdesk</span>
				<div class="d-flex align-items-center">
					<span class="navbar-text text-white me-3" id="user-name"></span>
					<button
						type="button"
						id="logout-btn"
						class="btn btn-outline-light btn-sm"
					>
						Odjava
					</button>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-md-8">
					<div class="d-flex justify-content-between align-items-center mb-3">
						<h4>Nova ulaznica</h4>
						<a href="tickets.html" class="btn btn-outline-secondary btn-sm"
							>Natrag</a
						>
					</div>

					<div id="alert" class="alert d-none" role="alert"></div>

					<div class="card">
						<div class="card-body">
							<div class="mb-3">
								<label class="form-label">Naslov</label>
								<input
									type="text"
									id="title"
									class="form-control"
									placeholder="Kratki opis problema"
								/>
							</div>
							<div class="mb-3">
								<label class="form-label">Opis</label>
								<textarea
									id="description"
									class="form-control"
									rows="6"
									placeholder="Detaljno opišite problem ili upit"
								></textarea>
							</div>
							<button type="button" id="submit-btn" class="btn btn-primary">
								Otvori ulaznicu
							</button>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/new-ticket.js"></script>
	</body>
</html>

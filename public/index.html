<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Helpdesk - Prijava</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<div class="container">
			<div class="row justify-content-center mt-5">
				<div class="col-md-5">
					<div class="text-center mb-4">
						<h2 class="fw-bold text-primary mb-0">Helpdesk</h2>
					</div>
					<div class="card">
						<div class="card-body p-4">
							<ul class="nav nav-tabs mb-3" role="tablist">
								<li class="nav-item">
									<button
										type="button"
										class="nav-link active"
										id="login-tab"
										data-view="login"
									>
										Prijava
									</button>
								</li>
								<li class="nav-item">
									<button
										type="button"
										class="nav-link"
										id="register-tab"
										data-view="register"
									>
										Registracija
									</button>
								</li>
							</ul>

							<div id="alert" class="alert d-none" role="alert"></div>

							<div id="login-view">
								<div class="mb-3">
									<label class="form-label">Email</label>
									<input type="email" id="login-email" class="form-control" />
								</div>
								<div class="mb-3">
									<label class="form-label">Lozinka</label>
									<input
										type="password"
										id="login-password"
										class="form-control"
									/>
								</div>
								<button
									type="button"
									id="login-btn"
									class="btn btn-primary w-100"
								>
									Prijavi se
								</button>
							</div>

							<div id="register-view" class="d-none">
								<div class="mb-3">
									<label class="form-label">Ime</label>
									<input type="text" id="reg-first-name" class="form-control" />
								</div>
								<div class="mb-3">
									<label class="form-label">Prezime</label>
									<input type="text" id="reg-last-name" class="form-control" />
								</div>
								<div class="mb-3">
									<label class="form-label">Email</label>
									<input type="email" id="reg-email" class="form-control" />
								</div>
								<div class="mb-3">
									<label class="form-label">Lozinka</label>
									<input
										type="password"
										id="reg-password"
										class="form-control"
									/>
								</div>
								<button
									type="button"
									id="register-btn"
									class="btn btn-primary w-100"
								>
									Registriraj se
								</button>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script src="js/api.js"></script>
		<script src="js/auth.js"></script>
	</body>
</html>

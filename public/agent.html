<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Agent - Sve ulaznice</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
			<div class="container">
				<span class="navbar-brand"
					>Helpdesk <span class="badge bg-primary">Agent</span></span
				>
				<div class="d-flex align-items-center">
					<a href="knowledge.html" class="btn btn-outline-light btn-sm me-2"
						>Baza znanja</a
					>
					<span class="navbar-text text-white me-3" id="user-name"></span>
					<button
						type="button"
						id="logout-btn"
						class="btn btn-outline-light btn-sm"
					>
						Odjava
					</button>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<div class="row g-2 mb-4" id="stats-row">
				<div class="col-6 col-md-3">
					<div class="card border-0 shadow-sm">
						<div
							class="card-body d-flex align-items-center justify-content-between py-2 px-3"
						>
							<span class="small text-muted">Ukupno</span>
							<span class="h5 mb-0" id="stat-total">-</span>
						</div>
					</div>
				</div>
				<div class="col-6 col-md-3">
					<div class="card border-0 shadow-sm">
						<div
							class="card-body d-flex align-items-center justify-content-between py-2 px-3"
						>
							<span class="small text-muted">Otvorene</span>
							<span class="h5 mb-0 text-success" id="stat-open">-</span>
						</div>
					</div>
				</div>
				<div class="col-6 col-md-3">
					<div class="card border-0 shadow-sm">
						<div
							class="card-body d-flex align-items-center justify-content-between py-2 px-3"
						>
							<span class="small text-muted">U obradi</span>
							<span class="h5 mb-0 text-warning" id="stat-progress">-</span>
						</div>
					</div>
				</div>
				<div class="col-6 col-md-3">
					<div class="card border-0 shadow-sm">
						<div
							class="card-body d-flex align-items-center justify-content-between py-2 px-3"
						>
							<span class="small text-muted">Prosj. (h)</span>
							<span class="h5 mb-0" id="stat-avg">-</span>
						</div>
					</div>
				</div>
			</div>
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h4>Sve ulaznice</h4>
				<div class="btn-group" role="group" id="status-filter">
					<button
						type="button"
						class="btn btn-outline-primary active"
						data-status="all"
					>
						Sve
					</button>
					<button
						type="button"
						class="btn btn-outline-primary"
						data-status="otvorena"
					>
						Otvorene
					</button>
					<button
						type="button"
						class="btn btn-outline-primary"
						data-status="u_obradi"
					>
						U obradi
					</button>
					<button
						type="button"
						class="btn btn-outline-primary"
						data-status="zatvorena"
					>
						Zatvorene
					</button>
				</div>
			</div>

			<div id="alert" class="alert d-none" role="alert"></div>

			<div id="empty-state" class="text-center text-muted py-5 d-none">
				Nema ulaznica za prikaz.
			</div>

			<table class="table table-hover d-none" id="tickets-table">
				<thead>
					<tr>
						<th>#</th>
						<th>Naslov</th>
						<th>Prijavio</th>
						<th>Kategorija</th>
						<th>Prioritet</th>
						<th>Status</th>
						<th>Datum</th>
					</tr>
				</thead>
				<tbody id="tickets-body"></tbody>
			</table>
		</div>

		<script src="js/api.js"></script>
		<script src="js/agent.js"></script>
	</body>
</html>

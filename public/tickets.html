<!doctype html>
<html lang="hr">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Moje ulaznice</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link href="css/style.css" rel="stylesheet" />
	</head>
	<body>
		<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
			<div class="container">
				<span class="navbar-brand">Helpdesk</span>
				<div class="d-flex align-items-center">
					<span class="navbar-text text-white me-3" id="user-name"></span>
					<button
						type="button"
						id="logout-btn"
						class="btn btn-outline-light btn-sm"
					>
						Odjava
					</button>
				</div>
			</div>
		</nav>

		<div class="container mt-4">
			<div class="d-flex justify-content-between align-items-center mb-3">
				<h4>Moje ulaznice</h4>
				<a href="new-ticket.html" class="btn btn-primary">Nova ulaznica</a>
			</div>

			<div id="alert" class="alert d-none" role="alert"></div>

			<div id="empty-state" class="text-center text-muted py-5 d-none">
				Nemate otvorenih ulaznica.
			</div>

			<table class="table table-hover d-none" id="tickets-table">
				<thead>
					<tr>
						<th>#</th>
						<th>Naslov</th>
						<th>Kategorija</th>
						<th>Prioritet</th>
						<th>Status</th>
						<th>Datum</th>
					</tr>
				</thead>
				<tbody id="tickets-body"></tbody>
			</table>
		</div>

		<script src="js/api.js"></script>
		<script src="js/tickets.js"></script>
	</body>
</html>
